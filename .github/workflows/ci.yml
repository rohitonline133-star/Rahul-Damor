name: GB Official CI

on:
  push:
    branches:
      - feature/gb-official-complete-suite
      - feature/gb-global-infrastructure
  pull_request:
    branches:
      - main
      - feature/gb-global-infrastructure
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gb-official-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Validate local infrastructure Compose configuration
        env:
          GB_POSTGRES_PASSWORD: ci-only-not-a-secret
        run: docker compose -f infra/docker-compose.yml config --quiet

      - name: Unit tests
        run: npm test

      - name: TypeScript check
        run: npm run lint

      - name: Production build
        run: npm run build
