name: GB Official CI

on:
  push:
    branches:
      - feature/gb-official-complete-suite
      - feature/gb-global-infrastructure
  pull_request:
    branches:
      - main
      - feature/gb-global-infrastructure
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gb-official-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: gb_ci
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: gb_official_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gb_ci -d gb_official_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://gb_ci:ci-only-not-a-secret@localhost:5432/gb_official_ci
      PGSSLMODE: disable
      GB_POSTGRES_PASSWORD: ci-only-not-a-secret
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Validate local infrastructure Compose configuration
        run: docker compose -f infra/docker-compose.yml config --quiet

      - name: Apply PostgreSQL migration
        run: npm run db:migrate

      - name: Verify migration idempotency and checksum
        run: npm run db:migrate

      - name: Unit tests
        run: npm test

      - name: TypeScript check
        run: npm run lint

      - name: Production build
        run: npm run build
